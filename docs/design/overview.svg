  <path d="M100 943H410" class="rule"/>
  <text x="100" y="971" class="body" font-weight="600">LinkedIn</text>
  <text x="100" y="992" class="small muted">Profilo professionale</text>
  <path d="M390 967h10v10m-1-9-12 12" fill="none" stroke="#17614D" stroke-width="1.5"/>
  <path d="M100 1013H410" class="rule"/>
  <text x="100" y="1046" class="small muted">Informativa privacy</text>
  <text x="410" y="1046" text-anchor="end" class="small muted">Nessuna app richiesta</text>
  <path d="M210 1075h90" stroke="#D5DFDA" stroke-width="4" stroke-linecap="round"/>

  <!-- Desktop editor, intentionally wider than adjacent screens. -->
  <rect x="486" y="264" width="954" height="698" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="486" y="264" width="954" height="698" rx="20" fill="none" stroke="#D5DFDA"/>
  <path d="M486 320H1440" class="rule"/>
  <circle cx="510" cy="292" r="4" fill="#BCCDC4"/><circle cx="524" cy="292" r="4" fill="#BCCDC4"/><circle cx="538" cy="292" r="4" fill="#BCCDC4"/>
  <text x="963" y="298" text-anchor="middle" class="small muted">Gestione / Profili / Profilo dimostrativo</text>
