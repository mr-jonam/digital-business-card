<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1280" viewBox="0 0 1920 1280" role="img" aria-labelledby="title desc">
  <title id="title">Digital Business Card — direzione visiva</title>
  <desc id="desc">Tre mockup statici: scheda pubblica mobile, editor desktop e condivisione QR. Tutti i dati sono dimostrativi. L'area QR è un segnaposto non scansionabile.</desc>
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#DCE6E0" stroke-width="0.6"/></pattern>
    <filter id="shadow" x="-15%" y="-12%" width="130%" height="135%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#203B2E" flood-opacity="0.08"/></filter>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #182B27; }
      .muted { fill: #52645E; }
      .accent { fill: #17614D; }
      .white { fill: #FFFFFF; }
      .mono { font-family: Consolas, monospace; }
      .label { font-size: 13px; font-weight: 600; letter-spacing: 1.6px; }
      .body { font-size: 15px; }
      .small { font-size: 12px; }
      .rule { stroke: #D5DFDA; stroke-width: 1; }
      .input { fill: #FFFFFF; stroke: #D5DFDA; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1920" height="1280" fill="#EEF3F0"/>
  <path d="M72 66H114" stroke="#17614D" stroke-width="4"/>
  <text x="130" y="71" class="label accent">DIGITAL BUSINESS CARD / DESIGN BLUEPRINT</text>
  <text x="72" y="130" font-size="42" font-weight="600" letter-spacing="-1.2">Il biglietto segue la conversazione.</text>
  <text x="72" y="165" font-size="17" class="muted">Una scheda sul tuo dominio. Il contatto sul telefono di chi incontri.</text>
  <text x="1848" y="72" text-anchor="end" class="mono small muted">23.10.2026 / CONCEPT 01</text>
  <path d="M72 194H1848" class="rule"/>

  <text x="72" y="237" class="label accent">01 / PRESENTATI</text>
  <text x="486" y="237" class="label accent">02 / GESTISCI E PUBBLICA</text>
  <text x="1488" y="237" class="label accent">03 / CONDIVIDI</text>

  <!-- Public mobile screen. -->
  <rect x="72" y="264" width="366" height="830" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="72" y="264" width="366" height="830" rx="28" fill="none" stroke="#D5DFDA"/>
  <rect x="92" y="283" width="326" height="34" rx="17" fill="#F3F6F4"/>
  <rect x="107" y="295" width="7" height="7" rx="2" fill="#17614D"/>
  <text x="125" y="305" class="small muted">cards.example.org/c/demo</text>
