  <rect x="500" y="435" width="156" height="42" rx="8" fill="#E9F1ED"/>
  <text x="518" y="461" class="body accent" font-weight="600">Profili</text>
  <text x="518" y="506" class="body muted">Marchio</text>
  <text x="518" y="550" class="body muted">Utenti</text>
  <text x="508" y="908" class="small muted">Installazione privata</text>
  <text x="508" y="929" class="small accent">cards.example.org</text>
  <text x="700" y="361" class="small muted">PROFILI / GENERALE</text>
  <text x="700" y="398" font-size="26" font-weight="600" letter-spacing="-0.5">Modifica profilo</text>
  <rect x="1309" y="343" width="101" height="29" rx="14" fill="#EDF3EF"/>
  <circle cx="1324" cy="357" r="3" fill="#17614D"/>
  <text x="1334" y="361" font-size="11" class="accent">Bozza salvata</text>
  <text x="700" y="428" class="small muted">Le modifiche saranno visibili dopo la pubblicazione.</text>
  <path d="M700 454H1410" class="rule"/>
  <text x="700" y="480" class="small accent" font-weight="600">Identità</text>
  <text x="786" y="480" class="small muted">Recapiti</text>
  <text x="873" y="480" class="small muted">Link</text>
  <text x="930" y="480" class="small muted">Contesti</text>
  <path d="M700 493h48" stroke="#17614D" stroke-width="2"/>
  <text x="700" y="531" class="small" font-weight="600">Nome visualizzato</text>
  <rect x="700" y="543" width="352" height="43" rx="8" class="input"/>
  <text x="714" y="570" class="body">Profilo dimostrativo</text>
  <text x="700" y="615" class="small" font-weight="600">Ruolo professionale</text>
  <rect x="700" y="627" width="352" height="43" rx="8" class="input"/>
  <text x="714" y="654" class="body">Ruolo professionale</text>
  <text x="700" y="699" class="small" font-weight="600">Presentazione breve</text>
  <rect x="700" y="711" width="352" height="74" rx="8" class="input"/>
  <text x="714" y="738" class="body">Progetti, idee e contatti.</text>
  <text x="700" y="806" class="small muted">Visibile nella scheda pubblica. Massimo 400 caratteri.</text>
  <text x="1090" y="529" class="small muted" letter-spacing="1">ANTEPRIMA</text>
  <rect x="1090" y="543" width="320" height="285" rx="16" fill="#F6F8F7" stroke="#D5DFDA"/>
  <circle cx="1126" cy="581" r="17" fill="#DFEAE3"/>
  <path d="M1117 590l8-18 11 18" fill="none" stroke="#17614D" stroke-width="1.2"/>
  <text x="1154" y="585" class="small muted">Organizzazione demo</text>
  <text x="1110" y="634" font-size="19" font-weight="600">Profilo dimostrativo</text>
  <text x="1110" y="659" class="small muted">Ruolo professionale</text>
  <text x="1110" y="687" class="small muted">Progetti, idee e contatti.</text>
  <rect x="1110" y="710" width="280" height="40" rx="8" fill="#17614D"/>
  <text x="1250" y="735" text-anchor="middle" font-size="13" class="white" font-weight="600">Salva contatto</text>
  <text x="1110" y="783" class="small">Il nostro sito</text>
  <text x="1390" y="783" text-anchor="end" class="small accent">↗</text>
  <text x="1090" y="851" font-size="11" class="muted">Anteprima privata / non è la versione pubblica</text>
  <path d="M670 880H1440" class="rule"/>
  <text x="700" y="924" class="small muted">Modifiche non pubblicate</text>
  <rect x="1074" y="897" width="139" height="43" rx="9" class="input"/>
  <text x="1143" y="923" text-anchor="middle" font-size="13">Salva bozza</text>
  <rect x="1227" y="897" width="183" height="43" rx="9" fill="#17614D"/>
  <text x="1318" y="923" text-anchor="middle" font-size="13" font-weight="600" class="white">Pubblica biglietto</text>

  <path d="M486 1005H540" stroke="#17614D" stroke-width="2"/>
  <text x="556" y="1011" font-size="17" font-weight="600">Un solo profilo. Il contesto giusto.</text>
  <text x="486" y="1045" class="body muted">Generale, evento o progetto: scegli quali link mostrare,</text>
  <text x="486" y="1069" class="body muted">mantieni i recapiti coerenti e conserva il QR già stampato.</text>

  <!-- Sharing screen. QR is clearly a placeholder, never a fake code. -->
  <rect x="1488" y="264" width="360" height="737" rx="24" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="1488" y="264" width="360" height="737" rx="24" fill="none" stroke="#D5DFDA"/>
  <text x="1514" y="306" class="small muted">← PROFILI</text>
  <text x="1514" y="351" font-size="26" font-weight="600" letter-spacing="-0.4">Portalo con te.</text>
  <text x="1514" y="379" class="body muted">Mostra, invia o salva il contatto.</text>
  <text x="1514" y="420" class="small" font-weight="600">Contesto da condividere</text>
  <rect x="1514" y="433" width="308" height="43" rx="8" class="input"/>
  <text x="1529" y="460" class="body">Generale</text>
  <path d="M1796 451l5 5 5-5" fill="none" stroke="#52645E" stroke-width="1.5"/>
  <rect x="1548" y="503" width="240" height="240" rx="14" fill="#F6F8F7" stroke="#D5DFDA"/>
  <rect x="1568" y="523" width="200" height="200" fill="url(#grid)"/>
  <rect x="1580" y="579" width="176" height="85" rx="8" fill="#F6F8F7"/>
  <text x="1668" y="615" text-anchor="middle" font-size="38" font-weight="600" class="accent">QR</text>
  <text x="1668" y="644" text-anchor="middle" class="small muted">URL permanente</text>
  <text x="1668" y="766" text-anchor="middle" class="small muted">Segnaposto di design / non scansionabile</text>
  <text x="1668" y="798" text-anchor="middle" class="mono small accent">cards.example.org/c/demo</text>
  <rect x="1514" y="821" width="148" height="45" rx="10" fill="#17614D"/>
  <text x="1588" y="849" text-anchor="middle" font-size="14" font-weight="600" class="white">Condividi</text>
  <rect x="1674" y="821" width="148" height="45" rx="10" class="input"/>
  <text x="1748" y="849" text-anchor="middle" font-size="14">Copia link</text>
  <path d="M1514 889H1822" class="rule"/>
  <text x="1514" y="919" class="body">Scarica QR</text>
  <text x="1822" y="919" text-anchor="end" class="small muted">PNG / SVG</text>
  <text x="1514" y="950" class="body">Scarica contatto</text>
  <text x="1822" y="950" text-anchor="end" class="small muted">.VCF</text>
  <text x="1514" y="981" class="body">Firma email</text>
  <text x="1822" y="981" text-anchor="end" class="small muted">HTML / TESTO</text>
  <text x="1488" y="1046" class="small muted">Sul proprio dominio, senza app.</text>
  <text x="1488" y="1069" class="small muted">Link e download sempre disponibili come fallback.</text>

  <path d="M72 1140H1848" class="rule"/>
  <text x="72" y="1174" class="label accent">DIREZIONE VISIVA</text>
  <rect x="72" y="1195" width="26" height="26" rx="7" fill="#17614D"/>
  <rect x="105" y="1195" width="26" height="26" rx="7" fill="#182B27"/>
  <rect x="138" y="1195" width="26" height="26" rx="7" fill="#D5DFDA"/>
  <text x="180" y="1213" class="small muted">Un accento configurabile. Testi chiari. Nessun font remoto.</text>
  <text x="760" y="1177" class="body" font-weight="600">Design prima del codice.</text>
  <text x="760" y="1205" class="small muted">Mockup statici: funzioni, accessibilità e deploy da implementare e verificare.</text>
  <text x="1848" y="1177" text-anchor="end" class="small muted">DATI FITTIZI / MARCHIO CONFIGURABILE</text>
  <text x="1848" y="1205" text-anchor="end" class="small muted">Nessun riferimento a persone o organizzazioni reali.</text>
</svg>
