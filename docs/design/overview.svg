  <text x="335" y="745" text-anchor="middle" class="body">Condividi</text>
  <text x="100" y="802" class="small muted" font-weight="600" letter-spacing="1">DOVE TROVARCI</text>
  <text x="100" y="839" class="body" font-weight="600">Il nostro sito</text>
  <text x="100" y="860" class="small muted">example.org</text>
