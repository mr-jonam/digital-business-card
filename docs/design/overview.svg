  <circle cx="137" cy="432" r="37" fill="#E4EEE8"/>
  <path d="M114 450l18-39 24 39" fill="none" stroke="#17614D" stroke-width="1.5"/>
  <text x="188" y="426" class="small accent" font-weight="600">IL TUO CONTATTO</text>
  <text x="188" y="447" class="small muted">Biglietto generale</text>
  <text x="100" y="512" font-size="32" font-weight="600" letter-spacing="-0.6">Profilo</text>
  <text x="100" y="550" font-size="32" font-weight="600" letter-spacing="-0.6">dimostrativo</text>
  <text x="100" y="584" font-size="16" class="muted">Ruolo professionale</text>
  <text x="100" y="618" font-size="15" class="muted">Progetti, idee e contatti.</text>
  <rect x="100" y="651" width="310" height="54" rx="12" fill="#17614D"/>
